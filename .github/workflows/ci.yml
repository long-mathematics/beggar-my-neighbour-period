name: Proof and paper
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed file hashes
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verifier dependency
        run: python -m pip install -r requirements.txt
      - name: Cross-check Casella et al. published infinite game
        run: python check_published_rules.py --json verification/ci_reference_rules.json
      - name: Check lower bound and 6-cycle
        run: python prove_minimum.py --json verification/ci_minimum.json
      - name: Check structural assertions
        run: python prove_minimum.py --structural --json verification/ci_structural.json
      - name: Check backward component
        run: python backward_component.py --json verification/ci_backward.json
      - name: Check both orientations of the backward component
        run: python verify_orbit_symmetry.py --json verification/ci_orbit_symmetry.json
      - name: Check rigidity certificate
        run: python check_rigidity.py --json verification/ci_rigidity.json
      - name: Check elementary algebraic rigidity proof
        run: python check_algebraic_rigidity.py --json verification/play_period/ci_algebraic_rigidity.json
      - name: Verify long-cycle witnesses and full inverse components
        run: |
          python3 long_cycles/verify.py --json /tmp/long_cycle_checks.json > /dev/null
          diff -u long_cycles/verification/long_cycle_checks.json /tmp/long_cycle_checks.json
      - name: Compile paper
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
          latexmk -pdf -interaction=nonstopmode -halt-on-error minimum_period.tex
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error long_cycles/long_cycles.tex
      - uses: actions/upload-artifact@v4
        with:
          name: beggar-minimum-period-paper
          path: minimum_period.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: beggar-long-cycles-paper
          path: long_cycles/long_cycles.pdf
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Z3 and C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev g++
      - name: Generate all six-trick face itineraries
        run: |
          c++ -O3 -std=c++20 skeleton6.cpp -o skeleton6
          ./skeleton6 skeleton6.tsv
          gzip -dc skeleton6.tsv.gz | cmp - skeleton6.tsv
      - name: Classify all 21407 skeletons using exact integer constraints
        run: python3 classify_six.py --json verification/ci_classification.json
      - name: Prove unique rank and gap model
        run: python3 enumerate_models.py --json verification/ci_classification_models.json
      - name: Independently check the complete face enumeration
        run: make crosscheck-six
      - name: Audit archived classification evidence
        run: python3 verify_classification_reports.py
  play-period:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact solvers and C++ compiler
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libz3-dev g++
      - name: Regenerate both candidate sets and classify all 43808 cases
        run: python verify_unique38.py --crosscheck --workers 2 --json verification/play_period/ci_classification.json
      - name: Independently check positive and blocked queries with native Z3
        run: python check_play_queries.py --classification verification/play_period/ci_classification.json --json verification/play_period/ci_native_query_check.json
      - uses: actions/upload-artifact@v4
        with:
          name: beggar-play-period-verification
          path: |
            verification/play_period/ci_classification.json
            verification/play_period/ci_native_query_check.json
            verification/play_period/known_sat38.smt2
            verification/play_period/known_sat38_blocked.smt2
