name: Proof and paper
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verifier dependency
        run: python -m pip install -r requirements.txt
      - name: Cross-check Casella et al. published infinite game
        run: python check_published_rules.py --json verification/ci_reference_rules.json
      - name: Check lower bound and 6-cycle
        run: python prove_minimum.py --json verification/ci_minimum.json
      - name: Check structural assertions
        run: python prove_minimum.py --structural --json verification/ci_structural.json
      - name: Check backward component
        run: python backward_component.py --json verification/ci_backward.json
      - name: Check rigidity certificate
        run: python check_rigidity.py --json verification/ci_rigidity.json
      - name: Compile paper
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
          latexmk -pdf -interaction=nonstopmode -halt-on-error minimum_period.tex
      - uses: actions/upload-artifact@v4
        with:
          name: beggar-minimum-period-paper
          path: minimum_period.pdf
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native Z3 and C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libz3-dev g++
      - name: Generate all six-trick face itineraries
        run: |
          c++ -O3 -std=c++20 skeleton6.cpp -o skeleton6
          ./skeleton6 skeleton6.tsv
          gzip -dc skeleton6.tsv.gz | cmp - skeleton6.tsv
      - name: Classify all 21407 skeletons using exact integer constraints
        run: python3 classify_six.py --json verification/ci_classification.json
      - name: Prove unique rank and gap model
        run: python3 enumerate_models.py --json verification/ci_classification_models.json
      - name: Independently check the complete face enumeration
        run: make crosscheck-six
      - name: Audit archived classification evidence
        run: python3 verify_classification_reports.py
